name: backend-cd-prod-v3

on:
  push:
    branches:
      - feature/1082

env:
  DOCKERHUB_REPOSITORY: ody-official

jobs:
  build-and-push:
#    if: github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'release-be/') || startsWith(github.event.pull_request.head.ref, 'hotfix-be/'))
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Seoul'
    defaults:
      run:
        working-directory: backend
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
#        with:
#          ref: feature/1082

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ${{ github.workspace }}/backend/build/test-results/**/*.xml

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Backup current image as previous
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/$DOCKERHUB_REPOSITORY:prod-latest || true
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/$DOCKERHUB_REPOSITORY:prod-latest \
                     ${{ secrets.DOCKERHUB_USERNAME }}/$DOCKERHUB_REPOSITORY:prod-previous || true
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/$DOCKERHUB_REPOSITORY:prod-previous || true

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}-prod" >> $GITHUB_OUTPUT

      - name: Build & Push (amd64)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/$DOCKERHUB_REPOSITORY:${{ steps.meta.outputs.tag }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/$DOCKERHUB_REPOSITORY:prod-latest \
            -f Dockerfile . --push

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/ody
            export TAG=${{ needs.build-and-push.outputs.image_tag }}
            sed -i "s|^TAG=.*|TAG=${TAG}|" .env
            docker compose --env-file .env pull
            docker compose --env-file .env up -d
            docker image prune -f

#      - name: Health Check
#        uses: nick-invision/retry@v2
#        with:
#          timeout_minutes: 2
#          max_attempts: 6
#          retry_wait_seconds: 10
#          command: |
#            response=$(curl -s https://prod.oody.site/actuator/health)
#            status=$(echo $response | jq -r '.status')
#            if [ "$status" = "UP" ]; then exit 0; else exit 1; fi

